version: "3.8"

services:
  mediacleaner:
    build: .
    image: mediacleaner:latest
    container_name: mediacleaner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9876}:9876"
    environment:
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - TZ=${TZ:-Europe/Paris}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - DOWNLOADS_PATH=/data
      # Paths multiples séparés par des virgules
      - SONARR_LIBRARY_PATHS=/data/Series_4K
      - RADARR_LIBRARY_PATHS=/data/Film
      - HIT_AND_RUN_DAYS=${HIT_AND_RUN_DAYS:-7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${DOWNLOADS_HOST_PATH:-/mnt/TANK/Downloads}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
